<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gsgc.jassi.dev/" />
    <meta property="og:title" content="Yes its me jassi, this is my super ultra mega game now on a website" />
    <meta property="og:description"
      content="a totally generic sand game which is not totally not inspired from the hit 1985 russian game which has falling blocks but instead of falling blocks its sand now which has cartoon gravity (it does not behave like sand unless it hits the ground)" />
    <meta property="og:image" content="https://gsgc.jassi.dev/assets/tuxsay_cool.png" />
    <link rel="icon" type="image/x-icon" href="/assets/icon.png">
    <title>Generic_Sand_Game.c</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      @font-face {
        font-family: cool_font;
        src: url("assets/augiepixel.ttf");
      }
      body {
        background-color: #000;
        background-image: url("assets/cool.png");
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      canvas {
        border: 0;
        outline: none;
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        aspect-ratio: 1590 / 900;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #btnReset {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        z-index: 3;
        width: 84px;
        height: 34px;
        border: 0;
        font-family: cool_font;
        font: cool_font;
        font-size: 37px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #000;
        touch-action: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>
    <button id="btnReset" type="button" onclick="window.location.reload()">
      Reset
    </button>
    <script>
      var canvasElement = document.getElementById("canvas");
      if (
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent,
        )
      ) {
        window.location.replace("/mobile.html");
      }

      canvasElement.addEventListener(
        "webglcontextlost",
        function (e) {
          alert("WebGL context lost. Please reload the page.");
          e.preventDefault();
        },
        false,
      );

      var Module = {
        canvas: canvasElement,
        print: function (...e) {
          console.log(...e);
        },
        printErr: function (...e) {
          console.error(...e);
        },
      };
    </script>
    <script async src="index.js"></script>
  </body>
</html>
